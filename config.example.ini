# AWS SSO and OIDC Automation Configuration
# Copy this file to config.ini and fill in your details
# The config.ini file is gitignored for security

[AWS_CREDENTIALS]
# Your AWS IAM user credentials
username = your-iam-username
password = your-password
console_url = https://123456789012.signin.aws.amazon.com/console

# Access keys (create these from AWS Console first)
# See docs/COMPLETE_FLOW_GUIDE.md for instructions
access_key_id = AKIAIOSFODNN7EXAMPLE
secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

# AWS Region
region = us-east-1

[GITHUB_OIDC]
# Set to true if you want to create GitHub Actions OIDC role
enabled = true

# Your GitHub repository details
github_org = betac0de
github_repo = my-app

# Custom role name (optional)
oidc_role_name = GitHubActionsOIDCRole

[AWS_SSO]
# Set to true if you want to create SSO configuration
enabled = true

# Custom role names (optional)
sso_role_name = SSOAdministratorRole
permission_set_name = AdministratorAccess
